[project]
name = "ai-quality-lab"
version = "0.1.0"
description = "A small RAG chatbot with an automated LLM quality gate (DeepEval + promptfoo + GitHub Actions)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.80",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "deepeval>=3.0",
]
tracing = [
    "arize-phoenix>=21.0.0",
    "arize-phoenix-otel>=0.17.3",
    "openinference-instrumentation-anthropic>=3.3.5",
    "openinference-semantic-conventions>=0.1.44",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["llm: calls the real Claude API (needs ANTHROPIC_API_KEY, costs money)"]
