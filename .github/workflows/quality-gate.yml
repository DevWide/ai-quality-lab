name: quality-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest

  llm-evals:
    needs: unit
    # Paid evals: run on PRs and manual runs only, not on every push to main.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret
        id: secret
        run: echo "present=$([ -n "$ANTHROPIC_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - run: uv sync
        if: steps.secret.outputs.present == 'true'

      - name: DeepEval (faithfulness, relevancy, correctness)
        if: steps.secret.outputs.present == 'true'
        run: uv run pytest evals_python -m llm -v

      - name: Start API
        if: steps.secret.outputs.present == 'true'
        run: |
          uv run uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done

      - name: promptfoo (regression + prompt injection)
        if: steps.secret.outputs.present == 'true'
        working-directory: evals-ts
        run: |
          npm install
          npm run eval

      - uses: actions/upload-artifact@v4
        if: always() && steps.secret.outputs.present == 'true'
        with:
          name: promptfoo-results
          path: evals-ts/output/
